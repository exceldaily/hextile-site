<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<title>HVAC Troubleshooting Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0e1116;--panel:#161b22;--panel-2:#1b222c;--panel-3:#212a35;--line:#2a3340;--line-soft:#232b35;
  --text:#e6edf3;--muted:#8b98a5;--muted-2:#6b7785;
  --blue:#3b9eff;--orange:#ff7a1a;--orange-soft:rgba(255,122,26,.14);--green:#38c172;--red:#ff5d5d;--amber:#f5b942;
  --r:12px;--r-lg:16px;--tap:56px;
  --display:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 600px at 78% -8%,rgba(59,158,255,.07),transparent 60%),radial-gradient(900px 500px at -5% 108%,rgba(255,122,26,.06),transparent 60%),var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 16px 64px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 0;margin-bottom:8px;background:linear-gradient(var(--bg) 72%,transparent)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.brand__mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,#20303f,#141a22);border:1px solid var(--line)}
.brand__name{font-family:var(--display);font-weight:700;letter-spacing:.04em;font-size:18px;text-transform:uppercase;line-height:1}
.brand__sub{font-size:11.5px;color:var(--muted-2);letter-spacing:.14em;text-transform:uppercase;display:block}
.topbar__spacer{flex:1}
.modeToggle{display:inline-flex;padding:4px;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.modeToggle__btn{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:8px 14px;border-radius:999px;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.modeToggle__btn[data-active='true']{color:#06131f;background:var(--orange)}
.modeToggle__btn[data-active='true'].is-fast{background:var(--blue);color:#04121f}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);letter-spacing:.01em;margin:0 0 8px}
.h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;margin:0}
.lede{color:var(--muted);max-width:60ch;margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{text-align:left;color:inherit;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-height:130px;display:flex;flex-direction:column;gap:8px;transition:transform .16s,border-color .16s,box-shadow .16s}
.card:hover{transform:translateY(-2px);border-color:#36506b;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card[data-primary='true']{background:linear-gradient(150deg,rgba(59,158,255,.16),rgba(59,158,255,.04)),var(--panel);border-color:#2f6aa8}
.card[data-soon='true']{opacity:.55;cursor:default}
.card[data-soon='true']:hover{transform:none;box-shadow:none;border-color:var(--line)}
.card__icon{color:var(--blue)}
.card[data-primary='true'] .card__icon{color:var(--orange)}
.card__title{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.01em}
.card__desc{color:var(--muted);font-size:13.5px}
.card__soon{margin-top:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2)}
.setup__steps{display:flex;flex-direction:column;gap:26px}
.step__head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.step__num{font-family:var(--mono);font-size:12px;color:var(--blue);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:0 18px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:#3a5570}
.chip[data-active='true']{background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:600}
.chip[data-has='true']::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.chip[data-active='true'][data-has='true']::after{background:#04121f}
.setup__cta{margin-top:30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{min-height:var(--tap);padding:0 26px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:10px;transition:.15s}
.btn:hover{border-color:#3a5570}
.btn--primary{background:var(--blue);border-color:var(--blue);color:#04121f}
.btn--primary:hover{background:#54acff}
.btn--primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted-2);cursor:not-allowed}
.setup__warn{color:var(--amber);font-size:13.5px}
.diag{display:grid;gap:18px;grid-template-columns:1fr 340px;align-items:start}
@media(max-width:900px){.diag{grid-template-columns:1fr}}
.progress{margin-bottom:18px}
.progress__meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.progress__stage{font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--orange)}
.progress__count{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.progress__track{height:4px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.progress__fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .4s}
.qcard{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.qcard__top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.qcard__stage{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px}
.qcard__title{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:.01em;margin:0}
.whyBtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:9px;background:var(--orange-soft);border:1px solid rgba(255,122,26,.35);color:var(--orange);font-weight:600;font-size:13px;transition:.15s}
.whyBtn:hover{background:rgba(255,122,26,.22)}
.whyBtn[data-open='true']{background:var(--orange);color:#1a0c02;border-color:var(--orange)}
.why{margin-top:16px;border-left:3px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0;padding:13px 16px;color:#f0d9c6;font-size:14.5px;line-height:1.55}
.why__tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:5px}
.answers{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.answer{min-height:var(--tap);padding:0 20px;text-align:left;background:var(--panel-3);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.15s}
.answer:hover{border-color:var(--blue);background:#243446}
.answer__arrow{color:var(--muted-2)}
.answer:hover .answer__arrow{color:var(--blue)}
.measure{margin-top:22px}
.measure__row{display:flex;align-items:stretch;gap:12px}
.measure__field{flex:1;display:flex;align-items:center;gap:10px;background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:0 16px}
.measure__input{flex:1;min-width:0;height:var(--tap);background:none;border:0;color:var(--text);font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em}
.measure__input::placeholder{color:var(--muted-2);font-weight:500}
.measure__input:focus{outline:none}
.measure__unit{font-family:var(--mono);font-size:15px;color:var(--muted)}
.measure__expected{margin-top:11px;font-size:13px;color:var(--muted);font-family:var(--mono)}
.measure__verdict{margin-top:13px;padding:12px 15px;border-radius:10px;font-size:14px;border:1px solid var(--line)}
.measure__verdict[data-tone='good']{color:#bdeccc;background:rgba(56,193,114,.1);border-color:rgba(56,193,114,.35)}
.measure__verdict[data-tone='bad']{color:#ffd0d0;background:rgba(255,93,93,.1);border-color:rgba(255,93,93,.35)}
.diag__nav{margin-top:20px;display:flex;gap:12px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;padding:8px 4px}
.linkbtn:hover{color:var(--text)}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
@media(max-width:900px){.rail{position:static}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.panel__head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.panel__title{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.live__pulse{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,26,.5)}70%{box-shadow:0 0 0 7px rgba(255,122,26,0)}100%{box-shadow:0 0 0 0 rgba(255,122,26,0)}}
.panel__hint{color:var(--muted-2);font-size:12.5px;margin:4px 0 14px}
.gauge{margin-bottom:14px}
.gauge:last-child{margin-bottom:0}
.gauge__row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.gauge__label{font-size:13.5px}
.gauge__val{font-family:var(--mono);font-size:13px;font-weight:700}
.gauge__track{height:8px;border-radius:5px;background:#0b0f14;overflow:hidden}
.gauge__fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.log__list{display:flex;flex-direction:column;margin-top:10px}
.log__item{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.log__item:first-child{border-top:0}
.log__q{color:var(--muted)}
.log__a{font-family:var(--mono);color:var(--text);white-space:nowrap;margin-left:auto}
.log__a[data-tone='bad']{color:var(--red)}
.log__a[data-tone='good']{color:var(--green)}
.result__head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.badge[data-tone='Easy']{color:var(--green);border-color:rgba(56,193,114,.4)}
.badge[data-tone='Moderate']{color:var(--amber);border-color:rgba(245,185,66,.4)}
.badge[data-tone='Advanced']{color:var(--red);border-color:rgba(255,93,93,.4)}
.result__diag{font-size:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:0 12px 12px 0;padding:16px 18px;margin:16px 0 24px}
.result__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.block__title{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.block--safety .block__title{color:var(--red)}
.block--parts .block__title{color:var(--orange)}
.block ul{margin:0;padding-left:18px}
.block li{margin-bottom:6px;font-size:14px}
.block p{margin:0;font-size:14.5px}
.result__actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
@media print{body{background:#fff;color:#000}.topbar,.rail,.result__actions,.whyBtn,.diag__nav{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

/* ============================================================
   KNOWLEDGE BASE — each workflow is pure data.
   Add a tree to TREES and it appears in the pickers automatically.
   ============================================================ */
var TREES = [
{
  id:"rtu-generic-no-cooling", equipment:"RTU", manufacturer:"Generic", symptom:"No Cooling",
  rootId:"q_tstat_call",
  causes:[
    {id:"thermostat",label:"Thermostat / no call"},
    {id:"transformer",label:"Transformer / 24V supply"},
    {id:"safety",label:"Open safety or float switch"},
    {id:"contactor",label:"Failed contactor"},
    {id:"capacitor",label:"Failed run capacitor"},
    {id:"compressor",label:"Compressor failure"},
    {id:"condfan",label:"Condenser fan failure"},
    {id:"lowcharge",label:"Low refrigerant charge"}
  ],
  nodes:{
    q_tstat_call:{id:"q_tstat_call",kind:"question",inputType:"yes_no",stage:"Control Circuit",
      title:"Is the thermostat calling for cooling?",
      why:"Confirm there is actually a cooling demand before you chase the unit. No call means it is the thermostat, its wiring, or settings — not the equipment. Set it to COOL with the setpoint a few degrees below room temp and listen for the call.",
      options:[
        {id:"yes",label:"Yes",next:"m_yc_voltage"},
        {id:"no",label:"No",next:"r_no_call",weights:{thermostat:65}}
      ]},
    m_yc_voltage:{id:"m_yc_voltage",kind:"measurement",stage:"Control Circuit",
      title:"Measure 24 VAC between Y and C at the unit",unit:"VAC",
      why:"This confirms the cooling call and 24V control power are actually reaching the equipment. If 24V is missing here, the problem is upstream — transformer, thermostat wire, blown low-voltage fuse, or an open safety/float switch — not the load side.",
      expected:{nominal:24,tolerancePct:20},
      branches:{inRange:"q_contactor_pulled",belowRange:"r_low_control_voltage",aboveRange:"q_contactor_pulled",default:"q_contactor_pulled"},
      weights:{belowRange:{transformer:45,safety:20},inRange:{transformer:-10}}},
    q_contactor_pulled:{id:"q_contactor_pulled",kind:"question",inputType:"yes_no",stage:"Contactor",
      title:"Is the contactor pulled in (energized)?",
      why:"The contactor is the relay that sends line power to the compressor and condenser fan. If 24V is present but the contactor is not pulled in, suspect the coil, an open safety in the 24V string (float switch, high/low pressure), or a broken low-voltage wire.",
      options:[
        {id:"yes",label:"Yes, pulled in",next:"m_capacitor"},
        {id:"no",label:"No",next:"r_contactor_not_pulled",weights:{contactor:45,safety:35,transformer:10}}
      ]},
    m_capacitor:{id:"m_capacitor",kind:"measurement",stage:"Capacitor",
      title:"Measure the run capacitor (µF)",unit:"µF",
      why:"A weak run cap is one of the most common no-cooling and compressor-won't-start causes. A reading well below the rated µF means the cap can't give the motor its run boost. Always discharge the capacitor before testing.",
      expected:{nominal:35,tolerancePct:6},
      branches:{inRange:"q_compressor_runs",belowRange:"r_failed_capacitor",aboveRange:"q_compressor_runs",default:"q_compressor_runs"},
      weights:{belowRange:{capacitor:72},inRange:{capacitor:-25}}},
    q_compressor_runs:{id:"q_compressor_runs",kind:"question",inputType:"yes_no",stage:"Compressor",
      title:"With the contactor pulled and the cap good, does the compressor run?",
      why:"Confirms whether the compressor itself starts. If it hums and trips on its internal overload but won't start with a known-good cap, suspect a seized rotor or bad windings. If it runs, move to the refrigerant and airflow side.",
      options:[
        {id:"yes",label:"Yes, it runs",next:"q_cond_fan"},
        {id:"no",label:"No / hums and trips",next:"r_compressor_suspect",weights:{compressor:58,capacitor:10}}
      ]},
    q_cond_fan:{id:"q_cond_fan",kind:"question",inputType:"yes_no",stage:"Condenser",
      title:"Is the condenser fan running while the compressor runs?",
      why:"The condenser fan rejects heat from the system. If it is not turning, head pressure climbs fast, the unit trips on high pressure, and you feel warm air at the registers. Check the fan capacitor, the motor, and that the blade spins free.",
      options:[
        {id:"yes",label:"Yes",next:"m_suction"},
        {id:"no",label:"No",next:"r_cond_fan",weights:{condfan:62}}
      ]},
    m_suction:{id:"m_suction",kind:"measurement",stage:"Refrigerant",
      title:"Measure suction (low-side) pressure",unit:"PSIG",
      why:"With the electrical side proven good, suction pressure tells you about charge and airflow. Low suction with high superheat usually means undercharge or a restriction. Very low suction can also be an airflow or iced-coil problem, so confirm airflow first.",
      expected:{nominal:118,tolerancePct:25},
      branches:{inRange:"r_charge_ok",belowRange:"r_low_charge",aboveRange:"r_high_suction",default:"r_charge_ok"},
      weights:{belowRange:{lowcharge:60},aboveRange:{compressor:25,lowcharge:-10}}},

    r_no_call:{id:"r_no_call",kind:"result",stage:"Result",title:"Thermostat is not calling for cooling",
      diagnosis:"No cooling call is reaching the equipment. The fault is at the thermostat or its low-voltage wiring, not the unit.",
      possibleCauses:["Thermostat in the wrong mode or setpoint above room temp","Dead thermostat batteries or unpowered stat","Broken or loose thermostat wire (Y or R)","Tripped condensate float switch wired at the stat"],
      nextStep:"Verify mode is COOL and setpoint is below room temperature. With power off at the board, jumper R to Y to force a call and confirm the unit responds.",
      recommendedParts:["Thermostat","Thermostat batteries"],
      safety:["Kill power before jumpering at the control board"],
      commonMistakes:["Condemning the unit when there is simply no call"],
      estimatedTime:"15–30 min",difficulty:"Easy"},
    r_low_control_voltage:{id:"r_low_control_voltage",kind:"result",stage:"Result",title:"Low or missing 24V control voltage",
      diagnosis:"A cooling call is present but 24V is low or absent at the unit. Control power is being lost upstream.",
      possibleCauses:["Weak or failed control transformer","Open safety in the 24V string (float, high/low pressure)","Blown low-voltage fuse","Shorted or pinched low-voltage wire"],
      nextStep:"Check transformer primary and secondary voltage, check the inline 24V fuse, then walk the safety string (float switch, HPS/LPS) to find the open device.",
      recommendedParts:["24V transformer","3A low-voltage fuse","Float switch"],
      safety:["Transformer primary is line voltage — confirm which side you are probing before contact"],
      commonMistakes:["Replacing the transformer when a downstream short keeps blowing it"],
      estimatedTime:"30–60 min",difficulty:"Moderate"},
    r_contactor_not_pulled:{id:"r_contactor_not_pulled",kind:"result",stage:"Result",title:"Contactor not energizing",
      diagnosis:"A cooling call is present but the contactor will not pull in.",
      possibleCauses:["Open condensate float or other 24V safety","Open high- or low-pressure switch","Failed contactor coil","Broken Y wire to the coil"],
      nextStep:"Measure 24V across the contactor coil. If 24V is present and it still won't pull, replace the contactor. If no 24V at the coil, walk the safety string to find the open device.",
      recommendedParts:["Contactor","Float switch"],
      safety:["Discharge capacitors and lock out line power before working at the contactor"],
      commonMistakes:["Replacing the contactor when an open float switch is the real cause"],
      estimatedTime:"30–45 min",difficulty:"Moderate"},
    r_failed_capacitor:{id:"r_failed_capacitor",kind:"result",stage:"Result",title:"Failed or weak run capacitor",
      diagnosis:"The run capacitor is reading below tolerance and can no longer drive the motor properly.",
      possibleCauses:["Aged or swollen capacitor","Heat damage from a hot cabinet"],
      nextStep:"Replace with the same µF and an equal-or-higher voltage rating, then confirm the motor starts and runs at normal amps.",
      recommendedParts:["Run capacitor (match µF and VAC rating)"],
      safety:["ALWAYS discharge the capacitor across the terminals before handling"],
      commonMistakes:["Installing the wrong µF or a lower voltage rating","Not discharging the cap first"],
      estimatedTime:"15–30 min",difficulty:"Easy"},
    r_compressor_suspect:{id:"r_compressor_suspect",kind:"result",stage:"Result",title:"Compressor not starting (known-good cap)",
      diagnosis:"With a good capacitor and power present, the compressor will not start — it is electrically or mechanically suspect.",
      possibleCauses:["Seized or locked rotor","Open or shorted windings","Open internal overload (compressor is hot)"],
      nextStep:"Ohm the windings C-R-S and check each to ground. Let a hot compressor cool and re-test in case the internal overload is open. A hard-start kit can be used as a diagnostic only.",
      recommendedParts:["Hard-start kit (test)","Compressor"],
      safety:["High amperage — discharge caps, lock out power, watch for hot surfaces"],
      commonMistakes:["Condemning a compressor that is only on a tripped internal overload — let it cool first"],
      estimatedTime:"60+ min",difficulty:"Advanced"},
    r_cond_fan:{id:"r_cond_fan",kind:"result",stage:"Result",title:"Condenser fan not running",
      diagnosis:"The compressor runs but the condenser fan does not, which will drive head pressure up and produce warm air.",
      possibleCauses:["Failed fan capacitor","Open or burned fan motor","Seized bearing","Blade obstruction"],
      nextStep:"Test the fan's capacitor, spin-test for free bearings, and ohm the motor windings.",
      recommendedParts:["Condenser fan motor","Fan capacitor"],
      safety:["The blade can spin up once powered — keep hands and tools clear"],
      commonMistakes:["Replacing the motor when only the capacitor is bad"],
      estimatedTime:"30–45 min",difficulty:"Moderate"},
    r_low_charge:{id:"r_low_charge",kind:"result",stage:"Result",title:"Low refrigerant charge or restriction",
      diagnosis:"Suction pressure is below range with the electrical side proven good, pointing to undercharge or a restriction.",
      possibleCauses:["Refrigerant leak","Undercharge","Restriction (TXV or filter drier)"],
      nextStep:"Confirm superheat and subcooling together, leak-search, then weigh in to spec. Do not just top it off.",
      recommendedParts:["Refrigerant","Filter drier","Leak repair materials"],
      safety:["Follow EPA recovery rules, wear PPE, never vent refrigerant"],
      commonMistakes:["Adding refrigerant without finding and fixing the leak"],
      estimatedTime:"60+ min",difficulty:"Advanced"},
    r_high_suction:{id:"r_high_suction",kind:"result",stage:"Result",title:"High suction pressure",

var EQUIPMENT=["RTU","Split System","Heat Pump","Walk-In Cooler","Walk-In Freezer","Reach-In Cooler","Reach-In Freezer","Ice Machine","Package Unit","Mini Split","Air Handler","Condensing Unit"];
var MANUFACTURERS=["Carrier","Trane","Lennox","York","Daikin","AAON","Goodman","Mitsubishi","Copeland","Generic"];
var SYMPTOMS=["No Cooling","No Heating","Breaker Trips","Compressor Will Not Start","Compressor Starts Then Stops","Outdoor Fan Not Running","Indoor Fan Not Running","Frozen Evaporator","High Head Pressure","Low Suction Pressure","High Superheat","Low Superheat","No 24 Volt Control Voltage","Short Cycling","Water Leak","Blowing Warm Air","Poor Airflow","Strange Noise","High Amp Draw","Low Voltage","No Power"];

function findTree(eq,man,sym){
  return TREES.find(function(t){return t.equipment===eq&&t.manufacturer===man&&t.symptom===sym;})
    || TREES.find(function(t){return t.equipment===eq&&t.manufacturer==="Generic"&&t.symptom===sym;});
}
function hasTree(eq,man,sym){return !!findTree(eq,man,sym);}

/* ============================================================
   ENGINE — pure functions over a session object
   ============================================================ */
function createSession(tree){
  var scores={};
  tree.causes.forEach(function(c){scores[c.id]=c.baseline||0;});
  return {tree:tree,currentId:tree.rootId,trail:[],log:[],scores:scores};
}
function currentNode(s){return s.tree.nodes[s.currentId];}
function applyWeights(scores,w){if(!w)return;Object.keys(w).forEach(function(k){scores[k]=(scores[k]||0)+(w[k]||0);});}
function answerQuestion(s,opt){
  var node=currentNode(s); if(node.kind!=="question")return;
  applyWeights(s.scores,opt.weights);
  s.log.push({nodeId:node.id,title:node.title,stage:node.stage,response:opt.label});
  s.trail.push(node.id); s.currentId=opt.next;
}
function evaluateMeasurement(node,v){
  var e=node.expected,lo=e.min,hi=e.max;
  if(e.nominal!=null&&e.tolerancePct!=null){var band=Math.abs(e.nominal)*(e.tolerancePct/100);lo=e.nominal-band;hi=e.nominal+band;}
  if(lo!=null&&v<lo)return"belowRange";
  if(hi!=null&&v>hi)return"aboveRange";
  return"inRange";
}
function deviationPct(node,v){var n=node.expected.nominal;if(n==null||n===0)return null;return Math.round((v-n)/n*100);}
function submitMeasurement(s,v){
  var node=currentNode(s); if(node.kind!=="measurement")return;
  var outcome=evaluateMeasurement(node,v);
  if(node.weights&&node.weights[outcome])applyWeights(s.scores,node.weights[outcome]);
  var next=(node.branches[outcome]!=null)?node.branches[outcome]:node.branches.default;
  s.log.push({nodeId:node.id,title:node.title,stage:node.stage,response:v+" "+node.unit,outcome:outcome});
  s.trail.push(node.id); s.currentId=next;
}
function recomputeScores(tree,log){
  var scores={}; tree.causes.forEach(function(c){scores[c.id]=c.baseline||0;});
  log.forEach(function(e){
    var node=tree.nodes[e.nodeId]; if(!node)return;
    if(node.kind==="question"){var o=node.options.find(function(x){return x.label===e.response;});if(o)applyWeights(scores,o.weights);}
    else if(node.kind==="measurement"&&e.outcome&&node.weights)applyWeights(scores,node.weights[e.outcome]);
  });
  return scores;
}
function goBack(s){
  if(s.trail.length===0)return;
  var prev=s.trail.pop(); s.log.pop();
  s.scores=recomputeScores(s.tree,s.log); s.currentId=prev;
}
function likelihoods(s){
  return s.tree.causes.map(function(c){
    return {id:c.id,label:c.label,confidence:Math.max(0,Math.min(99,Math.round(s.scores[c.id]||0)))};
  }).filter(function(l){return l.confidence>0;}).sort(function(a,b){return b.confidence-a.confidence;});
}

function expectedText(node){
  var e=node.expected;
  if(e.nominal!=null&&e.tolerancePct!=null){
    var lo=Math.round(e.nominal*(1-e.tolerancePct/100)*10)/10, hi=Math.round(e.nominal*(1+e.tolerancePct/100)*10)/10;
    return "Expected "+e.nominal+" "+node.unit+" \u00B1"+e.tolerancePct+"% ("+lo+"\u2013"+hi+")";
  }
  if(e.min!=null||e.max!=null)return "Expected range "+(e.min!=null?e.min:"\u2013")+"\u2013"+(e.max!=null?e.max:"\u2013")+" "+node.unit;
  return "";
}
function verdictHTML(node,v){
  if(v===""||isNaN(Number(v)))return"";
  var num=Number(v),outcome=evaluateMeasurement(node,num);
  if(outcome==="inRange")return '<div class="measure__verdict" data-tone="good">'+num+' '+node.unit+' is within the expected range.</div>';
  var dev=deviationPct(node,num),where=outcome==="belowRange"?"below":"above";
  var devText=dev!=null?(" ("+Math.abs(dev)+"% "+(dev<0?"below":"above")+" rated)"):"";
  return '<div class="measure__verdict" data-tone="bad">'+num+' '+node.unit+' is '+where+' the expected range'+devText+'.</div>';
}

    +'<h1 class="h1">'+esc(node.title)+'</h1>'
    +'<p class="panel__hint" style="font-size:13px">'+esc(s.tree.equipment)+' \u00B7 '+esc(s.tree.manufacturer)+' \u00B7 '+esc(s.tree.symptom)+'</p>'
    +'<div class="result__diag">'+esc(node.diagnosis)+'</div>'
    +'<div class="result__grid">'+grid+'</div>'
    +'<div class="result__actions"><button class="btn btn--primary" data-action="print">'+IC.print(18)+' Print / save log</button>'
    +'<button class="btn" data-action="restart">'+IC.refresh(18)+' New diagnostic</button></div>'
    +'<div style="margin-top:24px;max-width:520px">'+logPanelHTML(s)+'</div>';
}

function render(){
  var body;
  if(state.screen==="home")body=homeHTML();
  else if(state.screen==="setup")body=setupHTML();
  else body=diagHTML();
  root.innerHTML='<div class="app">'+topbar()+body+'</div>';

  // measurement input wiring (avoids full re-render on each keystroke)
  var input=document.getElementById("mInput");
  if(input){
    var node=currentNode(state.session);
    var submitBtn=document.getElementById("mSubmit");
    var verdict=document.getElementById("mVerdict");
    function sync(){
      var raw=input.value.trim();
      var valid=raw!==""&&!isNaN(Number(raw));
      submitBtn.disabled=!valid;
      verdict.innerHTML=verdictHTML(node,raw);
    }
    input.addEventListener("input",sync);
    input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!submitBtn.disabled)doMeasure();});
    setTimeout(function(){input.focus();},0);
  }
}

function navigatedToNewNode(){state.whyOpen=(state.mode==="training");}
function doMeasure(){
  var input=document.getElementById("mInput");
  if(!input)return;
  var v=Number(input.value);
  if(isNaN(v))return;
  submitMeasurement(state.session,v);
  navigatedToNewNode();
  render();
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]");
  if(!el)return;
  var a=el.getAttribute("data-action");
  if(a==="home"){state.screen="home";render();}
  else if(a==="start-setup"){state.screen="setup";render();}
  else if(a==="mode"){state.mode=el.getAttribute("data-mode");if(state.screen==="diag"&&state.session){var n=currentNode(state.session);if(n.kind!=="result")state.whyOpen=(state.mode==="training");}render();}
  else if(a==="pick"){state[el.getAttribute("data-field")]=el.getAttribute("data-value");render();}
  else if(a==="go-diag"){var t=findTree(state.equipment,state.manufacturer,state.symptom);if(t){state.session=createSession(t);state.screen="diag";navigatedToNewNode();render();}}
  else if(a==="answer"){var node=currentNode(state.session);var opt=node.options.find(function(o){return o.id===el.getAttribute("data-opt");});if(opt){answerQuestion(state.session,opt);navigatedToNewNode();render();}}
  else if(a==="measure-submit"){doMeasure();}
  else if(a==="why-toggle"){state.whyOpen=!state.whyOpen;render();}
  else if(a==="back"){goBack(state.session);navigatedToNewNode();render();}
  else if(a==="exit"){state.screen="setup";render();}
  else if(a==="restart"){state.screen="setup";state.session=null;render();}
  else if(a==="print"){window.print();}
});

render();
</script>
</body>
</html>
