name: Deploy checkout worker
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 deploy
      - name: Store Stripe secret key on the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler@3 secret put STRIPE_SECRET_KEY
      - name: Smoke test the live worker
        run: |
          sleep 5
          curl -s -X POST https://spring-firefly-f9c7.exceldaily7.workers.dev \
            -H "Content-Type: application/json" \
            -d '{"items":[{"price":"price_1TYh8HJcTL0QukOFppTrMgyb","quantity":1}]}' | head -c 400
          echo
