<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fff7ec" />
<title>Going Up! — Elevator Coloring Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#fff7ec;--panel:#ffffff;--ink:#263042;--soft:#6b7a90;
  --sun:#ffb703;--sky:#4cc9f0;--grass:#80c920;--berry:#ff5d8f;--grape:#9b5de5;
  --line:#f1e4cf;--shadow:0 10px 24px rgba(60,40,10,.12);
  --r:22px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(500px 300px at 8% -4%,rgba(76,201,240,.18),transparent 60%),
  radial-gradient(500px 320px at 96% -6%,rgba(255,183,3,.20),transparent 60%),
  var(--bg);
  color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 16px 70px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 0 10px;background:linear-gradient(var(--bg) 78%,transparent)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left}
.brand__mark{width:52px;height:52px;border-radius:16px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.brand__name{font-family:'Baloo 2';font-weight:800;font-size:24px;line-height:1.05;display:block}
.brand__sub{font-size:12.5px;color:var(--soft);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.topbar__spacer{flex:1}
.hero{margin:14px 0 6px}
.hero h1{font-family:'Baloo 2';font-weight:800;font-size:clamp(30px,5.4vw,52px);line-height:1.08;margin:0 0 10px}
.hero h1 .up{color:var(--berry)}
.hero p{max-width:62ch;color:var(--soft);font-weight:700;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px}
.chip{min-height:46px;padding:0 20px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:15px;font-family:'Baloo 2';transition:.15s;box-shadow:0 4px 0 rgba(38,48,66,.9)}
.chip:hover{transform:translateY(-2px)}
.chip[data-active='true']{background:var(--sun);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.pageCard{background:var(--panel);border:3px solid var(--ink);border-radius:var(--r);padding:14px 14px 16px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:10px;transition:transform .16s;box-shadow:var(--shadow)}
.pageCard:hover{transform:translateY(-4px) rotate(-.4deg)}
.pageCard__thumb{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:4/5}
.pageCard__thumb svg{width:100%;height:100%;display:block}
.pageCard__title{font-family:'Baloo 2';font-weight:800;font-size:19px;line-height:1.15}
.pageCard__tag{align-self:flex-start;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;border:2px solid var(--ink)}
.pageCard__tag[data-cat='Elevators']{background:#dff3ff}
.pageCard__tag[data-cat='Escalators']{background:#ffe8f1}
.pageCard__tag[data-cat='Excavators']{background:#fff3c9}
.colorbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.btn{min-height:48px;padding:0 20px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:15px;font-family:'Baloo 2';display:inline-flex;align-items:center;gap:9px;transition:.15s;box-shadow:0 4px 0 rgba(38,48,66,.9)}
.btn:hover{transform:translateY(-2px)}
.btn--sun{background:var(--sun)}
.btn--sky{background:#c9ecff}
.btn--danger:hover{background:#ffe1e1}
.colorbar__title{font-family:'Baloo 2';font-weight:800;font-size:clamp(20px,3vw,30px);margin:0 6px 0 0}
.studio{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:start}
@media(max-width:760px){.studio{grid-template-columns:1fr}}
.palette{position:sticky;top:86px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
@media(max-width:760px){.palette{position:static;grid-template-columns:repeat(10,1fr)}}
.swatch{width:100%;aspect-ratio:1;border-radius:12px;border:3px solid rgba(38,48,66,.35);padding:0;transition:.12s}
.swatch:hover{transform:scale(1.1)}
.swatch[data-active='true']{border-color:var(--ink);transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.swatch--eraser{background:repeating-linear-gradient(45deg,#fff 0 6px,#eef2f7 6px 12px)}
.stage{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.stage svg{width:100%;height:auto;display:block;touch-action:manipulation}
.stage .c{cursor:pointer}
.stage .c:hover{filter:brightness(.96)}
.hint{margin-top:12px;color:var(--soft);font-weight:700;font-size:14px;text-align:center}
.footer{margin-top:46px;text-align:center;color:var(--soft);font-weight:700;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 22px;font-weight:800;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0;z-index:100;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .stage,.stage *{visibility:visible}
  .stage{position:absolute;inset:0;border:0;box-shadow:none;padding:0}
  .stage svg{width:100%;max-height:100vh}
}
</style>
</head>

/* ============================================================
   CRAYON BOX
   ============================================================ */
var COLORS=["#ef4444","#f97316","#ffb703","#fde047","#84cc16","#22c55e","#14b8a6","#06b6d4","#3b82f6","#6366f1","#9b5de5","#d946ef","#ff5d8f","#fcd7b6","#c68642","#8d5524","#a3aab6","#475569"];

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
var state={screen:"home",cat:"All",pageId:null,color:COLORS[0],undo:[]};
var root=document.getElementById("root");
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function loadJSON(key,fb){try{var v=JSON.parse(localStorage.getItem(key));return v||fb;}catch(e){return fb;}}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function getSaves(){return loadJSON("color.saves",{});}
function setSave(pageId,fills){var s=getSaves();s[pageId]=fills;saveJSON("color.saves",s);}
function findPage(id){return PAGES.find(function(p){return p.id===id;});}

var toastTimer=null;
function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},2200);
}

/* ============================================================
   RENDER
   ============================================================ */
function crayonLogo(){
  return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#263042" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 15 8 H9 Z" fill="#ff5d8f"/><path d="M9 8 h6 v12 a1,1 0 0 1 -1,1 h-4 a1,1 0 0 1 -1,-1 Z" fill="#ffb703"/><path d="M9 11 h6" /></svg>';
}
function topbar(){
  return '<header class="topbar"><button class="brand" data-action="home">'
    +'<span class="brand__mark">'+crayonLogo()+'</span>'
    +'<span><span class="brand__name">Going Up!</span><span class="brand__sub">Coloring Book</span></span>'
    +'</button><div class="topbar__spacer"></div></header>';
}
function thumbSVG(p){
  return '<svg viewBox="0 0 800 1000" aria-hidden="true">'+p.svg+'</svg>';
}
function homeHTML(){
  var cats=["All","Elevators","Escalators","Excavators"];
  var chips=cats.map(function(c){
    return '<button class="chip" data-active="'+(state.cat===c)+'" data-action="cat" data-cat="'+c+'">'+c+'</button>';
  }).join("");
  var pages=PAGES.filter(function(p){return state.cat==="All"||p.cat===state.cat;});
  var cards=pages.map(function(p){
    return '<button class="pageCard" data-action="open" data-id="'+p.id+'">'
      +'<span class="pageCard__tag" data-cat="'+p.cat+'">'+p.cat.slice(0,-1)+'</span>'
      +'<span class="pageCard__thumb">'+thumbSVG(p)+'</span>'
      +'<span class="pageCard__title">'+esc(p.title)+'</span>'
      +'</button>';
  }).join("");
  return '<div class="hero"><h1>Pick a picture and <span class="up">color it in!</span></h1>'
    +'<p>Elevators going up, escalators rolling along, and excavators digging big holes. Tap a crayon, then tap the picture — or print a page and color it with real crayons!</p></div>'
    +'<div class="chips">'+chips+'</div>'
    +'<div class="grid">'+cards+'</div>'
    +'<p class="footer">Made for little button-pushers everywhere. Ding! 🛗</p>';
}
function colorHTML(){
  var p=findPage(state.pageId);
  if(!p){state.screen="home";return homeHTML();}
  var swatches=COLORS.map(function(c){
    return '<button class="swatch" style="background:'+c+'" data-active="'+(state.color===c)+'" data-action="swatch" data-color="'+c+'" aria-label="color '+c+'"></button>';
  }).join("");
  swatches+='<button class="swatch swatch--eraser" data-active="'+(state.color==="#ffffff")+'" data-action="swatch" data-color="#ffffff" aria-label="eraser"></button>';
  return '<div class="colorbar">'
    +'<button class="btn" data-action="home">← Back</button>'
    +'<h1 class="colorbar__title">'+esc(p.title)+'</h1>'
    +'<div class="topbar__spacer" style="flex:1"></div>'
    +'<button class="btn" data-action="undo">↩ Undo</button>'
    +'<button class="btn btn--sky" data-action="print">🖨 Print</button>'
    +'<button class="btn btn--sun" data-action="download">⬇ Save picture</button>'
    +'<button class="btn btn--danger" data-action="reset">✦ Start over</button>'
    +'</div>'
    +'<div class="studio">'
    +'<div class="palette">'+swatches+'</div>'
    +'<div><div class="stage" id="stage"><svg id="art" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">'+p.svg+'</svg></div>'
    +'<p class="hint">Tap a crayon, then tap a part of the picture to fill it in. Your coloring saves itself!</p></div>'
    +'</div>';
}
function render(){
  root.innerHTML='<div class="app">'+topbar()+(state.screen==="color"?colorHTML():homeHTML())+'</div>';
  if(state.screen==="color")applySaved();
}
function applySaved(){
  var art=document.getElementById("art");
  if(!art)return;
  var fills=getSaves()[state.pageId]||{};
  var regions=art.querySelectorAll(".c");
  regions.forEach(function(el,i){
    el.setAttribute("data-ri",i);
    if(fills[i])el.setAttribute("fill",fills[i]);
  });
}
function persistFills(){
  var art=document.getElementById("art");
  if(!art)return;
  var fills={};
  art.querySelectorAll(".c").forEach(function(el,i){
    var f=el.getAttribute("fill");
    if(f&&f!=="#ffffff")fills[i]=f;
  });
  setSave(state.pageId,fills);
}

/* ============================================================
   ACTIONS
   ============================================================ */
function downloadPNG(){
  var art=document.getElementById("art");
  if(!art)return;
  var clone=art.cloneNode(true);
  clone.setAttribute("width","1200");clone.setAttribute("height","1500");
  var bgRect=document.createElementNS("http://www.w3.org/2000/svg","rect");
  bgRect.setAttribute("x","0");bgRect.setAttribute("y","0");
  bgRect.setAttribute("width","800");bgRect.setAttribute("height","1000");
  bgRect.setAttribute("fill","#ffffff");
  clone.insertBefore(bgRect,clone.firstChild);
  clone.querySelectorAll("text").forEach(function(t){t.setAttribute("font-family","Arial, sans-serif");});
  var xml=new XMLSerializer().serializeToString(clone);
  var img=new Image();
  img.onload=function(){
    var canvas=document.createElement("canvas");
    canvas.width=1200;canvas.height=1500;
    canvas.getContext("2d").drawImage(img,0,0,1200,1500);
    var a=document.createElement("a");
    a.download=state.pageId+"-coloring.png";
    a.href=canvas.toDataURL("image/png");
    a.click();
    showToast("Picture saved!");
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);
}

document.addEventListener("click",function(ev){
  var region=ev.target.closest&&ev.target.closest(".c");
  if(region&&state.screen==="color"&&region.closest("#art")){
    var prev=region.getAttribute("fill")||"#ffffff";
    if(prev!==state.color){
      state.undo.push({ri:region.getAttribute("data-ri"),prev:prev});
      if(state.undo.length>200)state.undo.shift();
      region.setAttribute("fill",state.color);
      persistFills();
    }
    return;
  }
  var el=ev.target.closest("[data-action]");
  if(!el)return;
  var a=el.getAttribute("data-action");
  if(a==="home"){state.screen="home";state.undo=[];render();window.scrollTo(0,0);}
  else if(a==="cat"){state.cat=el.getAttribute("data-cat");render();}
  else if(a==="open"){state.pageId=el.getAttribute("data-id");state.screen="color";state.undo=[];render();window.scrollTo(0,0);}
  else if(a==="swatch"){
    state.color=el.getAttribute("data-color");
    document.querySelectorAll(".swatch").forEach(function(s){s.setAttribute("data-active",s.getAttribute("data-color")===state.color);});
  }
  else if(a==="undo"){
    var u=state.undo.pop();
    if(u){
      var target=document.querySelector('#art .c[data-ri="'+u.ri+'"]');
      if(target){target.setAttribute("fill",u.prev);persistFills();}
    }else showToast("Nothing to undo yet!");
  }
  else if(a==="print"){window.print();}
  else if(a==="download"){downloadPNG();}
  else if(a==="reset"){
    document.querySelectorAll("#art .c").forEach(function(r){r.setAttribute("fill","#ffffff");});
    state.undo=[];
    persistFills();
    showToast("Fresh page — color away!");
  }
});

render();
</script>
