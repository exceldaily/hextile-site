<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<title>HVAC Troubleshooting Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0e1116;--panel:#161b22;--panel-2:#1b222c;--panel-3:#212a35;--line:#2a3340;--line-soft:#232b35;
  --text:#e6edf3;--muted:#8b98a5;--muted-2:#6b7785;
  --blue:#3b9eff;--orange:#ff7a1a;--orange-soft:rgba(255,122,26,.14);--green:#38c172;--red:#ff5d5d;--amber:#f5b942;
  --r:12px;--r-lg:16px;--tap:56px;
  --display:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 600px at 78% -8%,rgba(59,158,255,.07),transparent 60%),radial-gradient(900px 500px at -5% 108%,rgba(255,122,26,.06),transparent 60%),var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:0 16px 64px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 0;margin-bottom:8px;background:linear-gradient(var(--bg) 72%,transparent)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.brand__mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,#20303f,#141a22);border:1px solid var(--line)}
.brand__name{font-family:var(--display);font-weight:700;letter-spacing:.04em;font-size:18px;text-transform:uppercase;line-height:1}
.brand__sub{font-size:11.5px;color:var(--muted-2);letter-spacing:.14em;text-transform:uppercase;display:block}
.topbar__spacer{flex:1}
.modeToggle{display:inline-flex;padding:4px;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.modeToggle__btn{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:8px 14px;border-radius:999px;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.modeToggle__btn[data-active='true']{color:#06131f;background:var(--orange)}
.modeToggle__btn[data-active='true'].is-fast{background:var(--blue);color:#04121f}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);letter-spacing:.01em;margin:0 0 8px}
.h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;margin:0}
.lede{color:var(--muted);max-width:60ch;margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{text-align:left;color:inherit;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-height:130px;display:flex;flex-direction:column;gap:8px;transition:transform .16s,border-color .16s,box-shadow .16s}
.card:hover{transform:translateY(-2px);border-color:#36506b;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card[data-primary='true']{background:linear-gradient(150deg,rgba(59,158,255,.16),rgba(59,158,255,.04)),var(--panel);border-color:#2f6aa8}
.card[data-soon='true']{opacity:.55;cursor:default}
.card[data-soon='true']:hover{transform:none;box-shadow:none;border-color:var(--line)}
.card__icon{color:var(--blue)}
.card[data-primary='true'] .card__icon{color:var(--orange)}
.card__title{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.01em}
.card__desc{color:var(--muted);font-size:13.5px}
.card__soon{margin-top:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2)}
.setup__steps{display:flex;flex-direction:column;gap:26px}
.step__head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.step__num{font-family:var(--mono);font-size:12px;color:var(--blue);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:0 18px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:#3a5570}
.chip[data-active='true']{background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:600}
.chip[data-has='true']::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.chip[data-active='true'][data-has='true']::after{background:#04121f}
.setup__cta{margin-top:30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{min-height:var(--tap);padding:0 26px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:10px;transition:.15s}
.btn:hover{border-color:#3a5570}
.btn--primary{background:var(--blue);border-color:var(--blue);color:#04121f}
.btn--primary:hover{background:#54acff}
.btn--primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted-2);cursor:not-allowed}
.setup__warn{color:var(--amber);font-size:13.5px}
.diag{display:grid;gap:18px;grid-template-columns:1fr 340px;align-items:start}
@media(max-width:900px){.diag{grid-template-columns:1fr}}
.progress{margin-bottom:18px}
.progress__meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.progress__stage{font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--orange)}
.progress__count{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.progress__track{height:4px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.progress__fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .4s}
.qcard{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.qcard__top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.qcard__stage{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px}
.qcard__title{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:.01em;margin:0}
.whyBtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:9px;background:var(--orange-soft);border:1px solid rgba(255,122,26,.35);color:var(--orange);font-weight:600;font-size:13px;transition:.15s}
.whyBtn:hover{background:rgba(255,122,26,.22)}
.whyBtn[data-open='true']{background:var(--orange);color:#1a0c02;border-color:var(--orange)}
.why{margin-top:16px;border-left:3px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0;padding:13px 16px;color:#f0d9c6;font-size:14.5px;line-height:1.55}
.why__tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:5px}
.answers{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.answer{min-height:var(--tap);padding:0 20px;text-align:left;background:var(--panel-3);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.15s}
.answer:hover{border-color:var(--blue);background:#243446}
.answer__arrow{color:var(--muted-2)}
.answer:hover .answer__arrow{color:var(--blue)}
.measure{margin-top:22px}
.measure__row{display:flex;align-items:stretch;gap:12px}
.measure__field{flex:1;display:flex;align-items:center;gap:10px;background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:0 16px}
.measure__input{flex:1;min-width:0;height:var(--tap);background:none;border:0;color:var(--text);font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em}
.measure__input::placeholder{color:var(--muted-2);font-weight:500}
.measure__input:focus{outline:none}
.measure__unit{font-family:var(--mono);font-size:15px;color:var(--muted)}
.measure__expected{margin-top:11px;font-size:13px;color:var(--muted);font-family:var(--mono)}
.measure__verdict{margin-top:13px;padding:12px 15px;border-radius:10px;font-size:14px;border:1px solid var(--line)}
.measure__verdict[data-tone='good']{color:#bdeccc;background:rgba(56,193,114,.1);border-color:rgba(56,193,114,.35)}
.measure__verdict[data-tone='bad']{color:#ffd0d0;background:rgba(255,93,93,.1);border-color:rgba(255,93,93,.35)}
.diag__nav{margin-top:20px;display:flex;gap:12px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;padding:8px 4px}
.linkbtn:hover{color:var(--text)}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
@media(max-width:900px){.rail{position:static}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.panel__head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.panel__title{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.live__pulse{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,26,.5)}70%{box-shadow:0 0 0 7px rgba(255,122,26,0)}100%{box-shadow:0 0 0 0 rgba(255,122,26,0)}}
.panel__hint{color:var(--muted-2);font-size:12.5px;margin:4px 0 14px}
.gauge{margin-bottom:14px}
.gauge:last-child{margin-bottom:0}
.gauge__row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.gauge__label{font-size:13.5px}
.gauge__val{font-family:var(--mono);font-size:13px;font-weight:700}
.gauge__track{height:8px;border-radius:5px;background:#0b0f14;overflow:hidden}
.gauge__fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.log__list{display:flex;flex-direction:column;margin-top:10px}
.log__item{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.log__item:first-child{border-top:0}
.log__q{color:var(--muted);flex:1;min-width:0}
.log__a{font-family:var(--mono);color:var(--text);white-space:nowrap;margin-left:auto}
.log__a[data-tone='bad']{color:var(--red)}
.log__a[data-tone='good']{color:var(--green)}
.result__head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.badge[data-tone='Easy']{color:var(--green);border-color:rgba(56,193,114,.4)}
.badge[data-tone='Moderate']{color:var(--amber);border-color:rgba(245,185,66,.4)}
.badge[data-tone='Advanced']{color:var(--red);border-color:rgba(255,93,93,.4)}
.result__diag{font-size:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:0 12px 12px 0;padding:16px 18px;margin:16px 0 24px}
.result__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.block__title{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
.block--safety .block__title{color:var(--red)}
.block--parts .block__title{color:var(--orange)}
.block ul{margin:0;padding-left:18px}
.block li{margin-bottom:6px;font-size:14px}
.block p{margin:0;font-size:14.5px}
.result__actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.starBtn{display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13.5px;transition:.15s}
.starBtn:hover{border-color:#3a5570;color:var(--text)}
.starBtn[data-on='true']{background:var(--orange-soft);border-color:rgba(255,122,26,.4);color:var(--orange)}
.starBtn[data-on='true'] svg{fill:var(--orange)}
.card__meta{margin-top:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.card__row{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.miniBtn{height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel-3);color:var(--text);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.miniBtn:hover{border-color:#3a5570}
.miniBtn[data-on='true']{background:var(--orange-soft);border-color:rgba(255,122,26,.4);color:var(--orange)}
.miniBtn[data-on='true'] svg{fill:var(--orange)}
.miniBtn--danger:hover{border-color:var(--red);color:var(--red)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r-lg);padding:38px 24px;text-align:center;color:var(--muted)}
.empty__icon{color:var(--muted-2);margin-bottom:12px;display:inline-flex}
.prose{max-width:64ch;color:var(--muted);line-height:1.7;font-size:15px}
.prose h3{font-family:var(--display);color:var(--text);font-size:17px;letter-spacing:.02em;margin:24px 0 8px}
.prose strong{color:var(--text)}
.statRow{display:flex;gap:14px;flex-wrap:wrap;margin:22px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;min-width:120px}
.stat__num{font-family:var(--display);font-weight:700;font-size:28px;color:var(--blue);line-height:1.1}
.stat__label{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
/* Toast notification */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-size:14px;font-weight:500;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0;z-index:100;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast[data-tone='good']{border-color:rgba(56,193,114,.4);color:#bdeccc}
.toast[data-tone='bad']{border-color:rgba(255,93,93,.4);color:#ffd0d0}
/* Scroll-to-top hint on mobile during long chip rows */
@media(max-width:600px){
  .chip{min-height:42px;padding:0 14px;font-size:13.5px}
  .modeToggle__btn{padding:7px 10px;font-size:11.5px}
  .qcard__title{font-size:21px}
  .measure__input{font-size:22px}
  .result__actions{gap:8px}
  .result__actions .btn{min-height:46px;font-size:14px;padding:0 16px}
}
@media print{body{background:#fff;color:#000}.topbar,.rail,.result__actions,.whyBtn,.diag__nav{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";

/* ============================================================
   KNOWLEDGE BASE
   ============================================================ */
var TREES = [
{
  id:"rtu-generic-no-cooling", equipment:"RTU", manufacturer:"Generic", symptom:"No Cooling",
  rootId:"q_tstat_call",
  causes:[
    {id:"thermostat",label:"Thermostat / no call"},
    {id:"transformer",label:"Transformer / 24V supply"},
    {id:"safety",label:"Open safety or float switch"},
    {id:"contactor",label:"Failed contactor"},
    {id:"capacitor",label:"Failed run capacitor"},
    {id:"compressor",label:"Compressor failure"},
    {id:"condfan",label:"Condenser fan failure"},
    {id:"lowcharge",label:"Low refrigerant charge"}
  ],
  nodes:{
    q_tstat_call:{id:"q_tstat_call",kind:"question",inputType:"yes_no",stage:"Control Circuit",
      title:"Is the thermostat calling for cooling?",
      why:"Confirm there is actually a cooling demand before you chase the unit. No call means it is the thermostat, its wiring, or settings — not the equipment. Set it to COOL with the setpoint a few degrees below room temp and listen for the call.",
      options:[
        {id:"yes",label:"Yes",next:"m_yc_voltage"},
        {id:"no",label:"No",next:"r_no_call",weights:{thermostat:65}}
      ]},
    m_yc_voltage:{id:"m_yc_voltage",kind:"measurement",stage:"Control Circuit",
      title:"Measure 24 VAC between Y and C at the unit",unit:"VAC",
      why:"This confirms the cooling call and 24V control power are actually reaching the equipment. If 24V is missing here, the problem is upstream — transformer, thermostat wire, blown low-voltage fuse, or an open safety/float switch — not the load side.",
      expected:{nominal:24,tolerancePct:20},
      branches:{inRange:"q_contactor_pulled",belowRange:"r_low_control_voltage",aboveRange:"q_contactor_pulled",default:"q_contactor_pulled"},
      weights:{belowRange:{transformer:45,safety:20},inRange:{transformer:-10}}},
    q_contactor_pulled:{id:"q_contactor_pulled",kind:"question",inputType:"yes_no",stage:"Contactor",
      title:"Is the contactor pulled in (energized)?",
      why:"The contactor is the relay that sends line power to the compressor and condenser fan. If 24V is present but the contactor is not pulled in, suspect the coil, an open safety in the 24V string (float switch, high/low pressure), or a broken low-voltage wire.",
      options:[
        {id:"yes",label:"Yes, pulled in",next:"m_capacitor"},
        {id:"no",label:"No",next:"r_contactor_not_pulled",weights:{contactor:45,safety:35,transformer:10}}
      ]},
    m_capacitor:{id:"m_capacitor",kind:"measurement",stage:"Capacitor",
      title:"Measure the run capacitor (µF)",unit:"µF",
      why:"A weak run cap is one of the most common no-cooling and compressor-won't-start causes. A reading well below the rated µF means the cap can't give the motor its run boost. Always discharge the capacitor before testing.",
      expected:{nominal:35,tolerancePct:6},
      branches:{inRange:"q_compressor_runs",belowRange:"r_failed_capacitor",aboveRange:"q_compressor_runs",default:"q_compressor_runs"},
      weights:{belowRange:{capacitor:72},inRange:{capacitor:-25}}},
    q_compressor_runs:{id:"q_compressor_runs",kind:"question",inputType:"yes_no",stage:"Compressor",
      title:"With the contactor pulled and the cap good, does the compressor run?",
      why:"Confirms whether the compressor itself starts. If it hums and trips on its internal overload but won't start with a known-good cap, suspect a seized rotor or bad windings. If it runs, move to the refrigerant and airflow side.",
      options:[
        {id:"yes",label:"Yes, it runs",next:"q_cond_fan"},
        {id:"no",label:"No / hums and trips",next:"r_compressor_suspect",weights:{compressor:58,capacitor:10}}
      ]},
    q_cond_fan:{id:"q_cond_fan",kind:"question",inputType:"yes_no",stage:"Condenser",
      title:"Is the condenser fan running while the compressor runs?",
      why:"The condenser fan rejects heat from the system. If it is not turning, head pressure climbs fast, the unit trips on high pressure, and you feel warm air at the registers. Check the fan capacitor, the motor, and that the blade spins free.",
      options:[
        {id:"yes",label:"Yes",next:"m_suction"},
        {id:"no",label:"No",next:"r_cond_fan",weights:{condfan:62}}
      ]},
    m_suction:{id:"m_suction",kind:"measurement",stage:"Refrigerant",
      title:"Measure suction (low-side) pressure",unit:"PSIG",
      why:"With the electrical side proven good, suction pressure tells you about charge and airflow. Low suction with high superheat usually means undercharge or a restriction. Very low suction can also be an airflow or iced-coil problem, so confirm airflow first.",
      expected:{nominal:118,tolerancePct:25},
      branches:{inRange:"r_charge_ok",belowRange:"r_low_charge",aboveRange:"r_high_suction",default:"r_charge_ok"},
      weights:{belowRange:{lowcharge:60},aboveRange:{compressor:25,lowcharge:-10}}},
    r_no_call:{id:"r_no_call",kind:"result",stage:"Result",title:"Thermostat is not calling for cooling",
      diagnosis:"No cooling call is reaching the equipment. The fault is at the thermostat or its low-voltage wiring, not the unit.",
      possibleCauses:["Thermostat in the wrong mode or setpoint above room temp","Dead thermostat batteries or unpowered stat","Broken or loose thermostat wire (Y or R)","Tripped condensate float switch wired at the stat"],
      nextStep:"Verify mode is COOL and setpoint is below room temperature. With power off at the board, jumper R to Y to force a call and confirm the unit responds.",
      recommendedParts:["Thermostat","Thermostat batteries"],
      safety:["Kill power before jumpering at the control board"],
      commonMistakes:["Condemning the unit when there is simply no call"],
      estimatedTime:"15–30 min",difficulty:"Easy"},
    r_low_control_voltage:{id:"r_low_control_voltage",kind:"result",stage:"Result",title:"Low or missing 24V control voltage",
      diagnosis:"A cooling call is present but 24V is low or absent at the unit. Control power is being lost upstream.",
      possibleCauses:["Weak or failed control transformer","Open safety in the 24V string (float, high/low pressure)","Blown low-voltage fuse","Shorted or pinched low-voltage wire"],

{

        {id:"yes",label:"Yes, gas confirmed",next:"q_igniter_ok"},
        {id:"no",label:"No / unsure",next:"r_no_gas",weights:{gas:75}}

        {id:"no",label:"No glow / no spark",next:"r_igniter_fail",weights:{ignition:65}}

      possibleCauses:["Thermostat in COOL or OFF mode","Setpoint below room temperature","Broken W wire","Dead thermostat batteries"],

      safety:["Kill power before jumpering at the control board"],
      commonMistakes:["Ignoring mode/setpoint before opening the unit"],
      estimatedTime:"15–30 min",difficulty:"Easy"},
    r_idf_fail:{id:"r_idf_fail",kind:"result",stage:"Result",title:"Induced draft fan not starting",

      safety:["Keep hands clear of moving parts; flue gases are present during operation"],
      commonMistakes:["Replacing a pressure switch without cleaning a blocked condensate port first"],
      estimatedTime:"30–60 min",difficulty:"Moderate"},
    r_no_gas:{id:"r_no_gas",kind:"result",stage:"Result",title:"No gas supply",
      diagnosis:"Gas is not reaching the unit — the ignition sequence cannot light regardless of the igniter condition.",
      possibleCauses:["Manual shutoff closed","Meter off or tripped","Regulator failure","Supply pressure too low"],
      nextStep:"Confirm inlet pressure with a manometer (typical: 7\" W.C. natural gas). Open shutoff and re-test.",
      recommendedParts:["Gas pressure regulator (if failed)"],
      safety:["Never attempt to bypass a gas valve — if you smell gas, evacuate and call the gas company"],
      commonMistakes:["Replacing the gas valve when supply pressure is simply absent"],
      estimatedTime:"15–30 min",difficulty:"Easy"},
    r_igniter_fail:{id:"r_igniter_fail",kind:"result",stage:"Result",title:"Igniter not firing",

      possibleCauses:["Cracked or failed HSI element","Weak HSI (check µA or resistance)","Failed spark module","Board not sending ignition voltage"],
      nextStep:"Measure HSI resistance (typical: 40–90Ω cold). Check for 120V at the HSI during the ignition trial. Replace if cracked or open.",
      recommendedParts:["Hot surface igniter","Spark module"],
      safety:["HSI runs at 120V and reaches 1800°F — do not touch when energized"],
      commonMistakes:["Touching HSI with bare fingers — skin oils crack the element when it heats"],

    r_gas_valve_or_flame:{id:"r_gas_valve_or_flame",kind:"result",stage:"Result",title:"Gas valve or flame sensor suspect",
      diagnosis:"The igniter fires but the burner won't stay lit — suspect the gas valve not opening or the flame sensor not proving the flame.",
      possibleCauses:["Failed gas valve (no 24V or coil open)","Dirty or oxidized flame sensor rod","Reversed polarity (flame sensor needs good earth ground)","Low µA flame signal"],
      nextStep:"Measure 24V to the gas valve during trial. Clean the flame sensor with fine steel wool. Measure µA (typical: >1.5µA). Check ground polarity.",

  }

{
  id:"rtu-generic-breaker-trips", equipment:"RTU", manufacturer:"Generic", symptom:"Breaker Trips",
  rootId:"q_trip_timing",
  causes:[
    {id:"compressor",label:"Compressor locked rotor / shorted"},
    {id:"wiring",label:"Wiring short or ground fault"},

  ],
  nodes:{
    q_trip_timing:{id:"q_trip_timing",kind:"question",inputType:"yes_no",stage:"Circuit",
      title:"Does the breaker trip immediately when reset (within seconds)?",
      why:"Immediate trips point to a dead short or ground fault. Delayed trips (minutes) suggest a sustained overload — usually a struggling compressor, high ambient, or a weak breaker that's tired.",
      options:[
        {id:"yes",label:"Yes, immediately",next:"q_ground_fault"},
        {id:"no",label:"No, trips after running a while",next:"q_high_amps",weights:{overload:30,breaker:20}}
      ]},
    q_ground_fault:{id:"q_ground_fault",kind:"question",inputType:"yes_no",stage:"Circuit",
      title:"With power off, do you measure a short to ground on any load (compressor, fan motor)?",
      why:"A megohm test or even a continuity check between each leg and ground identifies which device is faulted. A shorted compressor winding to ground will immediately trip the breaker every time.",
      options:[
        {id:"yes",label:"Yes, found a ground fault",next:"r_ground_fault",weights:{compressor:50,wiring:30,condfan:20}},
        {id:"no",label:"No ground fault found",next:"r_weak_breaker",weights:{breaker:55,capacitor:20}}
      ]},
    m_rla:{id:"m_rla",kind:"measurement",stage:"Amps",
      title:"Measure compressor RLA with clamp meter",unit:"A",
      why:"Running Load Amps tells you if the compressor is working too hard. Compare to the nameplate RLA. Anything above FLA (Full Load Amps) sustained will trip the breaker — a bad cap, high head pressure, or a dying compressor will all push amps up.",
      expected:{nominal:18,tolerancePct:15},
      branches:{inRange:"r_check_ambient",belowRange:"r_check_ambient",aboveRange:"r_high_amp_draw",default:"r_check_ambient"},
      weights:{aboveRange:{compressor:35,capacitor:25,overload:20}}},
    q_high_amps:{id:"q_high_amps",kind:"question",inputType:"yes_no",stage:"Amps",
      title:"Are compressor amps above nameplate RLA?",
      why:"If amps are high and it trips on a delay, rule out the cap (raises start amps), high head pressure (hard work), and high ambient before condemning the compressor.",
      options:[
        {id:"yes",label:"Yes, above RLA",next:"r_high_amp_draw",weights:{compressor:35,capacitor:25,overload:20}},
        {id:"no",label:"No, amps look normal",next:"r_weak_breaker",weights:{breaker:55}}
      ]},
    r_ground_fault:{id:"r_ground_fault",kind:"result",stage:"Result",title:"Ground fault on a load device",
      diagnosis:"A winding or wiring has shorted to ground, causing an immediate trip every time the circuit is energized.",
      possibleCauses:["Shorted compressor winding to ground","Burned fan motor winding","Chafed wire touching cabinet"],
      nextStep:"Isolate each load (disconnect compressor, fan) and megohm-test each. Replace the faulted device.",
      recommendedParts:["Compressor","Condenser fan motor"],
      safety:["Lock out / tag out before any wiring work — a faulted circuit can arc violently"],
      commonMistakes:["Resetting and running the unit to 'see what happens' — this damages more wiring"],
      estimatedTime:"60+ min",difficulty:"Advanced"},
    r_high_amp_draw:{id:"r_high_amp_draw",kind:"result",stage:"Result",title:"High amp draw — overload condition",
      diagnosis:"The unit is drawing more current than the breaker can sustain. This is usually a mechanical or refrigerant problem, not a straight electrical fault.",
      possibleCauses:["Weak run capacitor driving high start/run amps","High head pressure (dirty condenser, hot ambient)","Refrigerant overcharge","Compressor beginning to fail mechanically"],
      nextStep:"Test capacitor µF, clean condenser coil, check head pressure, verify charge. If amps are still high with everything else correct, the compressor is suspect.",
      recommendedParts:["Run capacitor","Compressor"],
      safety:["Check for hot surfaces — a laboring compressor runs extremely hot"],
      commonMistakes:["Upsizing the breaker to make the trip go away — this masks a real overload and is a fire hazard"],
      estimatedTime:"45–90 min",difficulty:"Moderate"},
    r_weak_breaker:{id:"r_weak_breaker",kind:"result",stage:"Result",title:"Weak or nuisance-tripping breaker",
      diagnosis:"No ground fault, normal amps — the breaker itself is likely worn or was undersized from the start.",
      possibleCauses:["Breaker weakened by repeated trips","Undersized for unit MCA/MOP","Loose connection causing heat at the lug"],
      nextStep:"Check the unit's nameplate MCA and MOP, verify the breaker size matches, check for warm/loose lug connections, and replace if worn.",
      recommendedParts:["Circuit breaker (match MOP on nameplate)"],
      safety:["Work inside the main panel with a qualified electrician — panel is always energized upstream"],
      commonMistakes:["Installing a larger breaker than MOP to 'fix' the trip — this is a code violation and fire risk"],
      estimatedTime:"30–60 min",difficulty:"Moderate"},
    r_check_ambient:{id:"r_check_ambient",kind:"result",stage:"Result",title:"Amps in range — check ambient and condenser",
      diagnosis:"Amps are acceptable. The delayed trip is likely environmental — high ambient or a dirty condenser coil pushing the unit to its thermal limit.",
      possibleCauses:["Dirty condenser coil","High ambient temperature","Restricted airflow around the condenser","Unit cycling at high load for extended period"],
      nextStep:"Clean the condenser coil, verify 18\" clearance on all sides, check that the condenser fan runs, and monitor amps over a full cycle.",
      recommendedParts:["Coil cleaner"],
      safety:["Standard PPE"],
      commonMistakes:["Condemning the compressor when the condenser just needs cleaning"],
      estimatedTime:"30–45 min",difficulty:"Easy"}
  }

function findTree(eq,man,sym){
  return TREES.find(function(t){return t.equipment===eq&&t.manufacturer===man&&t.symptom===sym;})
    || TREES.find(function(t){return t.equipment===eq&&t.manufacturer==="Generic"&&t.symptom===sym;});
}

/* ============================================================
   ENGINE
   ============================================================ */
function createSession(tree){
  var scores={};
  tree.causes.forEach(function(c){scores[c.id]=c.baseline||0;});
  return {tree:tree,currentId:tree.rootId,trail:[],log:[],scores:scores};
}
function currentNode(s){return s.tree.nodes[s.currentId];}
function applyWeights(scores,w){if(!w)return;Object.keys(w).forEach(function(k){scores[k]=(scores[k]||0)+(w[k]||0);});}
function answerQuestion(s,opt){
  var node=currentNode(s); if(node.kind!=="question")return;
  applyWeights(s.scores,opt.weights);
  s.log.push({nodeId:node.id,title:node.title,stage:node.stage,response:opt.label});
  s.trail.push(node.id); s.currentId=opt.next;
}
function evaluateMeasurement(node,v){
  var e=node.expected,lo=e.min,hi=e.max;
  if(e.nominal!=null&&e.tolerancePct!=null){var band=Math.abs(e.nominal)*(e.tolerancePct/100);lo=e.nominal-band;hi=e.nominal+band;}
  if(lo!=null&&v<lo)return"belowRange";
  if(hi!=null&&v>hi)return"aboveRange";
  return"inRange";
}
function deviationPct(node,v){var n=node.expected.nominal;if(n==null||n===0)return null;return Math.round((v-n)/n*100);}
function submitMeasurement(s,v){
  var node=currentNode(s); if(node.kind!=="measurement")return;
  var outcome=evaluateMeasurement(node,v);
  if(node.weights&&node.weights[outcome])applyWeights(s.scores,node.weights[outcome]);
  var next=(node.branches[outcome]!=null)?node.branches[outcome]:node.branches.default;
  s.log.push({nodeId:node.id,title:node.title,stage:node.stage,response:v+" "+node.unit,outcome:outcome});
  s.trail.push(node.id); s.currentId=next;
}
function recomputeScores(tree,log){
  var scores={}; tree.causes.forEach(function(c){scores[c.id]=c.baseline||0;});
  log.forEach(function(e){
    var node=tree.nodes[e.nodeId]; if(!node)return;
    if(node.kind==="question"){var o=node.options.find(function(x){return x.label===e.response;});if(o)applyWeights(scores,o.weights);}
    else if(node.kind==="measurement"&&e.outcome&&node.weights)applyWeights(scores,node.weights[e.outcome]);
  });
  return scores;
}
function goBack(s){
  if(s.trail.length===0)return;
  var prev=s.trail.pop(); s.log.pop();
  s.scores=recomputeScores(s.tree,s.log); s.currentId=prev;
}
function likelihoods(s){
  return s.tree.causes.map(function(c){
    return {id:c.id,label:c.label,confidence:Math.max(0,Math.min(99,Math.round(s.scores[c.id]||0)))};
  }).filter(function(l){return l.confidence>0;}).sort(function(a,b){return b.confidence-a.confidence;});
}

var toastTimer=null;
function showToast(msg,tone){
  var t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg;
  t.setAttribute("data-tone",tone||"");
  t.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},2600);
}

function loadJSON(key,fallback){try{var v=JSON.parse(localStorage.getItem(key));return v||fallback;}catch(e){return fallback;}}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function favKey(eq,man,sym){return eq+"|"+man+"|"+sym;}
function getFavs(){return loadJSON("hvac.favs",[]);}
function isFav(eq,man,sym){var k=favKey(eq,man,sym);return getFavs().some(function(f){return f.key===k;});}
function toggleFav(eq,man,sym){
  var favs=getFavs(),k=favKey(eq,man,sym),i=-1;
  favs.forEach(function(f,idx){if(f.key===k)i=idx;});
  var added;
  if(i>=0){favs.splice(i,1);added=false;}else{favs.unshift({key:k,equipment:eq,manufacturer:man,symptom:sym,ts:Date.now()});added=true;}
  saveJSON("hvac.favs",favs);
  showToast(added?"Added to favorites":"Removed from favorites",added?"good":"");
}
function getSaved(){return loadJSON("hvac.saved",[]);}
function saveDiagnostic(s,node){
  var saved=getSaved();
  saved.unshift({
    id:"d"+Date.now(),ts:Date.now(),
    equipment:s.tree.equipment,manufacturer:s.tree.manufacturer,symptom:s.tree.symptom,
    title:node.title,diagnosis:node.diagnosis,difficulty:node.difficulty||"",estimatedTime:node.estimatedTime||"",
    log:s.log.map(function(e){return {title:e.title,response:e.response,outcome:e.outcome||""};})
  });
  saveJSON("hvac.saved",saved.slice(0,50));
  showToast("Saved to job log","good");
}
function deleteSaved(id){
  saveJSON("hvac.saved",getSaved().filter(function(d){return d.id!==id;}));
  showToast("Deleted","");
}

    +'<span class="card__desc">'+esc(d.equipment)+' · '+esc(d.symptom)+'</span>'
    +'<span class="card__meta">'+esc(fmtDate(d.ts))+(d.difficulty?' · '+esc(d.difficulty):'')+'</span>'
    +'<div class="card__row">'
    +'<button class="miniBtn" data-action="view-saved" data-id="'+esc(d.id)+'">'+IC.info(14)+' Review</button>'
    +'<button class="miniBtn" data-action="launch" '+dataAttrs(d)+'>'+IC.refresh(14)+' Run again</button>'
    +'<button class="miniBtn miniBtn--danger" data-action="delete-saved" data-id="'+esc(d.id)+'">Delete</button>'
    +'</div></div>';
}
function savedHTML(){
  var saved=getSaved();
  var body=saved.length
    ? '<div class="cards">'+saved.map(savedCard).join("")+'</div>'
    : emptyState(IC.list(28),"No saved diagnostics","Finish a diagnostic and tap Save to job log to keep the full step record here.","Start a diagnostic","start-setup");
  return backHome()+pageHead("Saved Diagnostics","Your job log","")+body;
}
function savedLogPanel(d){
  var rows=d.log.map(function(e){
    var tone=e.outcome==="inRange"?"good":(e.outcome==="belowRange"||e.outcome==="aboveRange")?"bad":"";
    return '<div class="log__item"><span class="log__q">'+esc(e.title)+'</span><span class="log__a" data-tone="'+tone+'">'+esc(e.response)+'</span></div>';
  }).join("");
  return '<div class="panel"><div class="panel__head">'+IC.list(16)+'<span class="panel__title">Diagnostic Log</span></div>'
    +(rows?'<div class="log__list">'+rows+'</div>':'<p class="panel__hint">No steps recorded.</p>')+'</div>';
}
function savedViewHTML(){
  var d=getSaved().find(function(x){return x.id===state.viewId;});
  if(!d)return savedHTML();
  return '<button class="linkbtn" data-action="open-saved">'+IC.back(16)+' All saved</button>'
    +'<div class="result__head" style="margin-top:10px"><p class="eyebrow" style="margin:0">Saved diagnosis</p>'
    +(d.difficulty?'<span class="badge" data-tone="'+esc(d.difficulty)+'">'+esc(d.difficulty)+'</span>':'')
    +(d.estimatedTime?'<span class="badge">'+esc(d.estimatedTime)+'</span>':'')+'</div>'
    +'<h1 class="h1">'+esc(d.title)+'</h1>'
    +'<p class="panel__hint" style="font-size:13px">'+esc(d.equipment)+' · '+esc(d.manufacturer)+' · '+esc(d.symptom)+' · '+esc(fmtDate(d.ts))+'</p>'
    +(d.diagnosis?'<div class="result__diag">'+esc(d.diagnosis)+'</div>':'')
    +'<div style="max-width:520px">'+savedLogPanel(d)+'</div>'
    +'<div class="result__actions"><button class="btn btn--primary" data-action="launch" '+dataAttrs(d)+'>'+IC.refresh(18)+' Run this again</button>'
    +'<button class="btn miniBtn--danger" data-action="delete-saved" data-id="'+esc(d.id)+'">Delete</button></div>';
}
function aboutHTML(){
  var stats='<div class="statRow">'
    +'<div class="stat"><div class="stat__num">'+treeList().length+'</div><div class="stat__label">Diagnostic trees</div></div>'
    +'<div class="stat"><div class="stat__num">'+EQUIPMENT.length+'</div><div class="stat__label">Equipment types</div></div>'
    +'<div class="stat"><div class="stat__num">'+SYMPTOMS.length+'</div><div class="stat__label">Symptoms</div></div>'
    +'</div>';
  var prose='<div class="prose">'
    +'<p>HVAC Assist is a guided, decision-tree diagnostic tool — not a chatbot. Every workflow is a structured tree of <strong>questions</strong> and <strong>measurements</strong>. Each answer you give branches to the next most useful check and adjusts the confidence behind each suspected cause, so you reach a diagnosis the way a senior tech would: by elimination, not guesswork.</p>'
    +'<h3>Two ways to work</h3>'
    +'<p><strong>Fast</strong> mode keeps the screen lean for techs who just want the next step. <strong>Training</strong> mode opens the "Why am I checking this?" note on every step so newer techs see the reasoning behind each test. Flip between them any time from the toggle up top.</p>'
    +'<h3>Live confidence</h3>'
    +'<p>The Live Diagnosis panel weighs each suspected fault as you go. Measurements are scored against expected ranges (with tolerance), and the running tally shifts toward the most likely cause — fully visible, never a black box.</p>'
    +'<h3>Favorites &amp; job log</h3>'
    +'<p>Pin the workflows you hit most for one-tap access, and save any finished diagnostic to your job log to review the full step record later. Both are stored on this device.</p>'
    +'<h3>Built to grow</h3>'
    +'<p>Every workflow is pure data. New equipment, brands, and symptoms drop straight into the pickers as trees are added — the green dot on the setup screen marks the combinations that are loaded today.</p>'
    +'</div>';
  return backHome()+pageHead("About","How the diagnostic engine works","")+stats+prose;
}
function chipRow(field,options,value){
  return '<div class="chips">'+options.map(function(o){
    var eq=field==="equipment"?o:state.equipment;
    var man=field==="manufacturer"?o:state.manufacturer;
    var sym=field==="symptom"?o:state.symptom;
    var has=hasTree(eq,man,sym);
    return '<button class="chip" data-active="'+(value===o)+'" '+(has?'data-has="true"':'')+' data-action="pick" data-field="'+field+'" data-value="'+esc(o)+'">'+esc(o)+'</button>';
  }).join("")+'</div>';
}
function setupHTML(){
  var ready=hasTree(state.equipment,state.manufacturer,state.symptom);
  return '<button class="linkbtn" data-action="home">'+IC.back(16)+' Home</button>'
    +'<p class="eyebrow" style="margin-top:10px">New Diagnostic</p><h1 class="h1">Set up the job</h1>'
    +'<div class="setup__steps">'
    +'<div><div class="step__head"><span class="step__num">01</span><h2 class="h2">Equipment</h2></div>'+chipRow("equipment",EQUIPMENT,state.equipment)+'</div>'
    +'<div><div class="step__head"><span class="step__num">02</span><h2 class="h2">Manufacturer</h2></div>'+chipRow("manufacturer",MANUFACTURERS,state.manufacturer)+'</div>'
    +'<div><div class="step__head"><span class="step__num">03</span><h2 class="h2">Primary symptom</h2></div>'+chipRow("symptom",SYMPTOMS,state.symptom)+'</div>'
    +'</div>'
    +'<div class="setup__cta"><button class="btn btn--primary" '+(ready?'':'disabled')+' data-action="go-diag">Start diagnostic '+IC.arrow(18)+'</button>'
    +(ready?'<button class="starBtn" data-on="'+isFav(state.equipment,state.manufacturer,state.symptom)+'" data-action="fav-toggle" data-eq="'+esc(state.equipment)+'" data-man="'+esc(state.manufacturer)+'" data-sym="'+esc(state.symptom)+'">'+IC.star(15)+(isFav(state.equipment,state.manufacturer,state.symptom)?' Favorited':' Favorite')+'</button>':'')
    +(ready?'':'<span class="setup__warn">No tree for this combination yet — the green dot marks combinations that are loaded.</span>')+'</div>';
}

function livePanelHTML(s){
  var items=likelihoods(s);
  var body;
  if(items.length===0){body='<p class="panel__hint">Confidence updates as you answer. No leading suspects yet.</p>';}
  else{
    body='<div style="margin-top:12px">'+items.map(function(it){
      var c=it.confidence>=70?"#ff7a1a":it.confidence>=40?"#f5b942":"#3b9eff";
      return '<div class="gauge"><div class="gauge__row"><span class="gauge__label">'+esc(it.label)+'</span><span class="gauge__val" style="color:'+c+'">'+it.confidence+'%</span></div>'
        +'<div class="gauge__track"><div class="gauge__fill" style="width:'+it.confidence+'%;background:'+c+'"></div></div></div>';
    }).join("")+'</div>';
  }
  return '<div class="panel"><div class="panel__head"><span class="live__pulse"></span>'+IC.gauge(16)+'<span class="panel__title">Live Diagnosis</span></div>'+body+'</div>';
}
function logPanelHTML(s){
  var body;
  if(s.log.length===0){body='<p class="panel__hint">Every step you take is recorded here for the job record.</p>';}
  else{
    body='<div class="log__list">'+s.log.map(function(e){
      var tone=e.outcome==="inRange"?"good":(e.outcome==="belowRange"||e.outcome==="aboveRange")?"bad":"";
      return '<div class="log__item"><span class="log__q">'+esc(e.title)+'</span><span class="log__a" data-tone="'+tone+'">'+esc(e.response)+'</span></div>';
    }).join("")+'</div>';
  }
  return '<div class="panel"><div class="panel__head">'+IC.list(16)+'<span class="panel__title">Diagnostic Log</span></div>'+body+'</div>';
}

function expectedText(node){
  var e=node.expected;
  if(e.nominal!=null&&e.tolerancePct!=null){
    var lo=Math.round(e.nominal*(1-e.tolerancePct/100)*10)/10, hi=Math.round(e.nominal*(1+e.tolerancePct/100)*10)/10;
    return "Expected "+e.nominal+" "+node.unit+" ±"+e.tolerancePct+"% ("+lo+"–"+hi+")";
  }
  if(e.min!=null||e.max!=null)return "Expected range "+(e.min!=null?e.min:"–")+"–"+(e.max!=null?e.max:"–")+" "+node.unit;
  return "";
}
function verdictHTML(node,v){
  if(v===""||isNaN(Number(v)))return"";
  var num=Number(v),outcome=evaluateMeasurement(node,num);
  if(outcome==="inRange")return '<div class="measure__verdict" data-tone="good">'+IC.check(14)+' '+num+' '+node.unit+' is within the expected range.</div>';
  var dev=deviationPct(node,num),where=outcome==="belowRange"?"below":"above";
  var devText=dev!=null?(" ("+Math.abs(dev)+"% "+(dev<0?"below":"above")+" rated)"):"";
  return '<div class="measure__verdict" data-tone="bad">'+num+' '+node.unit+' is '+where+' the expected range'+devText+'.</div>';
}

function questionCardHTML(node){
  var showWhy=node.why&&(state.mode==="training"||state.whyOpen);
  var top='<div class="qcard__top"><div>'+(node.stage?'<div class="qcard__stage">'+esc(node.stage)+'</div>':'')
    +'<h2 class="qcard__title">'+esc(node.title)+'</h2></div>'
    +(node.why?'<button class="whyBtn" data-open="'+(state.whyOpen||state.mode==="training")+'" data-action="why-toggle">'+IC.q(15)+' Why?</button>':'')+'</div>';
  var why=showWhy?'<div class="why"><span class="why__tag">Why am I checking this?</span>'+esc(node.why)+'</div>':'';
  var bottom;
  if(node.kind==="question"){
    bottom='<div class="answers">'+node.options.map(function(o){
      return '<button class="answer" data-action="answer" data-opt="'+esc(o.id)+'">'+esc(o.label)+'<span class="answer__arrow">'+IC.arrow(18)+'</span></button>';
    }).join("")+'</div>';
  }else{
    var ex=expectedText(node);
    bottom='<div class="measure"><div class="measure__row">'
      +'<div class="measure__field"><input id="mInput" class="measure__input" inputmode="decimal" type="number" placeholder="0.0" autofocus /><span class="measure__unit">'+esc(node.unit)+'</span></div>'
      +'<button class="btn btn--primary" id="mSubmit" data-action="measure-submit" disabled>Enter '+IC.arrow(18)+'</button></div>'
      +(ex?'<div class="measure__expected">'+ex+'</div>':'')
      +'<div id="mVerdict"></div></div>';
  }
  return '<div class="qcard">'+top+why+bottom+'</div>';
}

function diagHTML(){
  var s=state.session,node=currentNode(s);
  if(node.kind==="result")return resultHTML(node);
  var fill=Math.min(0.92,0.12+s.log.length*0.16);
  return '<button class="linkbtn" data-action="exit">'+IC.back(16)+' Exit diagnostic</button>'
    +'<div class="progress" style="margin-top:10px"><div class="progress__meta">'
    +'<span class="progress__stage">'+esc(node.stage||"Diagnostic")+'</span>'
    +'<span class="progress__count">'+esc(s.tree.equipment)+' · '+esc(s.tree.symptom)+' · Step '+(s.log.length+1)+'</span></div>'
    +'<div class="progress__track"><div class="progress__fill" style="width:'+(fill*100)+'%"></div></div></div>'
    +'<div class="diag">'+questionCardHTML(node)+'<div class="rail">'+livePanelHTML(s)+logPanelHTML(s)+'</div></div>'
    +(s.trail.length>0?'<div class="diag__nav"><button class="linkbtn" data-action="back">'+IC.back(15)+' Back one step</button></div>':'');
}

function block(title,inner,variant){return '<div class="block'+(variant?' block--'+variant:'')+'"><h3 class="block__title">'+title+'</h3>'+inner+'</div>';}
function ul(items){return '<ul>'+items.map(function(i){return '<li>'+esc(i)+'</li>';}).join("")+'</ul>';}
function resultHTML(node){
  var s=state.session;
  var saved=state.resultSaved;
  var grid='';
  if(node.possibleCauses&&node.possibleCauses.length)grid+=block("Possible causes",ul(node.possibleCauses));
  if(node.nextStep)grid+=block("Recommended next step",'<p>'+esc(node.nextStep)+'</p>');
  if(node.recommendedParts&&node.recommendedParts.length)grid+=block("Recommended parts",ul(node.recommendedParts),"parts");
  if(node.commonMistakes&&node.commonMistakes.length)grid+=block("Common mistakes",ul(node.commonMistakes));
  if(node.safety&&node.safety.length)grid+=block("Safety reminders",ul(node.safety),"safety");
  return '<button class="linkbtn" data-action="back">'+IC.back(16)+' Back a step</button>'
    +'<div class="result__head" style="margin-top:10px"><p class="eyebrow" style="margin:0">Most likely diagnosis</p>'
    +(node.difficulty?'<span class="badge" data-tone="'+node.difficulty+'">'+node.difficulty+'</span>':'')
    +(node.estimatedTime?'<span class="badge">'+esc(node.estimatedTime)+'</span>':'')+'</div>'
    +'<h1 class="h1">'+esc(node.title)+'</h1>'
    +'<p class="panel__hint" style="font-size:13px">'+esc(s.tree.equipment)+' · '+esc(s.tree.manufacturer)+' · '+esc(s.tree.symptom)+'</p>'
    +'<div class="result__diag">'+esc(node.diagnosis)+'</div>'
    +'<div class="result__grid">'+grid+'</div>'
    +'<div class="result__actions">'
    +'<button class="btn" data-action="save-diag" '+(saved?'disabled':'')+' style="'+(saved?'border-color:rgba(56,193,114,.4);color:#bdeccc':'')+'">'+IC.list(18)+(saved?' Saved to job log':' Save to job log')+'</button>'
    +'<button class="starBtn" data-on="'+isFav(s.tree.equipment,s.tree.manufacturer,s.tree.symptom)+'" data-action="fav-toggle" data-eq="'+esc(s.tree.equipment)+'" data-man="'+esc(s.tree.manufacturer)+'" data-sym="'+esc(s.tree.symptom)+'">'+IC.star(16)+(isFav(s.tree.equipment,s.tree.manufacturer,s.tree.symptom)?' Favorited':' Favorite')+'</button>'
    +'<button class="btn" data-action="print">'+IC.print(18)+' Print</button>'
    +'<button class="btn btn--primary" data-action="restart">'+IC.refresh(18)+' New diagnostic</button></div>'
    +'<div style="margin-top:24px;max-width:520px">'+logPanelHTML(s)+'</div>';
}

function render(){
  var scrollY=window.scrollY||0;
  var body;
  if(state.screen==="home")body=homeHTML();
  else if(state.screen==="setup")body=setupHTML();
  else if(state.screen==="faults")body=faultsHTML();
  else if(state.screen==="favorites")body=favoritesHTML();
  else if(state.screen==="saved")body=savedHTML();
  else if(state.screen==="saved-view")body=savedViewHTML();
  else if(state.screen==="about")body=aboutHTML();
  else body=diagHTML();
  root.innerHTML='<div class="app">'+topbar()+body+'</div>';

  // measurement input wiring
  var input=document.getElementById("mInput");
  if(input){
    var node=currentNode(state.session);
    var submitBtn=document.getElementById("mSubmit");
    var verdict=document.getElementById("mVerdict");
    function sync(){
      var raw=input.value.trim();
      var valid=raw!==""&&!isNaN(Number(raw));
      submitBtn.disabled=!valid;
      verdict.innerHTML=verdictHTML(node,raw);
    }
    input.addEventListener("input",sync);
    input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!submitBtn.disabled)doMeasure();});
    setTimeout(function(){try{input.focus();}catch(e){}},0);
  }

  // restore scroll position on re-renders that don't change screen
  if(state._sameScreen){window.scrollTo(0,scrollY);state._sameScreen=false;}
}

function navigatedToNewNode(){state.whyOpen=(state.mode==="training");state.resultSaved=false;}
function doMeasure(){
  var input=document.getElementById("mInput");
  if(!input)return;
  var v=Number(input.value);
  if(isNaN(v))return;
  submitMeasurement(state.session,v);
  navigatedToNewNode();
  render();
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-action]");
  if(!el)return;
  var a=el.getAttribute("data-action");
  if(a==="home"){state.screen="home";render();}
  else if(a==="start-setup"){state.screen="setup";render();}
  else if(a==="mode"){
    state.mode=el.getAttribute("data-mode");
    if(state.screen==="diag"&&state.session){
      var n=currentNode(state.session);
      if(n.kind!=="result")state.whyOpen=(state.mode==="training");
    }
    state._sameScreen=true;
    render();
  }
  else if(a==="pick"){
    state[el.getAttribute("data-field")]=el.getAttribute("data-value");
    state._sameScreen=true;
    render();
  }
  else if(a==="go-diag"){
    var t=findTree(state.equipment,state.manufacturer,state.symptom);
    if(t){state.session=createSession(t);state.screen="diag";navigatedToNewNode();render();}
  }
  else if(a==="answer"){
    var node=currentNode(state.session);
    var opt=node.options.find(function(o){return o.id===el.getAttribute("data-opt");});
    if(opt){answerQuestion(state.session,opt);navigatedToNewNode();window.scrollTo(0,0);render();}
  }
  else if(a==="measure-submit"){doMeasure();}
  else if(a==="why-toggle"){state.whyOpen=!state.whyOpen;state._sameScreen=true;render();}
  else if(a==="back"){goBack(state.session);navigatedToNewNode();render();}
  else if(a==="exit"){state.screen="setup";render();}
  else if(a==="restart"){state.screen="setup";state.session=null;render();}
  else if(a==="print"){window.print();}
  else if(a==="open-faults"){state.screen="faults";render();}
  else if(a==="open-favorites"){state.screen="favorites";render();}
  else if(a==="open-saved"){state.screen="saved";render();}
  else if(a==="open-about"){state.screen="about";render();}
  else if(a==="launch"){
    state.equipment=el.getAttribute("data-eq");
    state.manufacturer=el.getAttribute("data-man");
    state.symptom=el.getAttribute("data-sym");
    var lt=findTree(state.equipment,state.manufacturer,state.symptom);
    if(lt){state.session=createSession(lt);state.screen="diag";navigatedToNewNode();}
    else{state.screen="setup";}
    render();
  }
  else if(a==="fav-toggle"){
    toggleFav(el.getAttribute("data-eq"),el.getAttribute("data-man"),el.getAttribute("data-sym"));
    state._sameScreen=true;
    render();
  }
  else if(a==="save-diag"){
    if(state.session&&!state.resultSaved){
      saveDiagnostic(state.session,currentNode(state.session));
      state.resultSaved=true;
      state._sameScreen=true;
      render();
    }
  }
  else if(a==="view-saved"){state.viewId=el.getAttribute("data-id");state.screen="saved-view";render();}
  else if(a==="delete-saved"){
    deleteSaved(el.getAttribute("data-id"));
    if(state.screen==="saved-view")state.screen="saved";
    render();
  }
});

render();
</script>
</body>
</html>
