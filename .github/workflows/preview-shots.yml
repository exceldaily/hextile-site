name: Preview screenshots
on: workflow_dispatch

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright-core (uses preinstalled Chrome)
        run: npm i --no-save playwright-core@1
      - name: Render full-page screenshots
        run: node preview-shots.js
      - name: Commit screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/
          if ! git diff --cached --quiet; then
            git commit -m "Add rendered preview screenshots [skip ci]"
            git push
          else
            echo "No screenshot changes."
          fi
